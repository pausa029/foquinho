<style>
:root {
  --bg: #fbf1de; --surface: #ffffff; --ink: #1c2a2e; --muted: #4d5d61; --line: #e3d5ba;
  --teal: #17707a; --teal-d: #0f545c; --on-teal: #ffffff;
  --orange: #f6a531; --turq: #2cc0b3; --lilac: #be9be0; --pink: #f6909a; --purple: #8f35c9;
  --tile-ink: #16262a; --danger: #b3261e; --ok: #1b6e3c; --focus: #0b3aa8;
  --fs: 17px; color-scheme: light;
}
:root.fs1 { --fs: 20px; } :root.fs2 { --fs: 23px; }
:root.hc {
  --bg: #000000; --surface: #000000; --ink: #ffffff; --muted: #ffffff; --line: #ffffff;
  --teal: #ffd600; --teal-d: #ffd600; --on-teal: #000000;
  --orange: #000000; --turq: #000000; --lilac: #000000; --pink: #000000; --purple: #ffd600;
  --tile-ink: #ffd600; --danger: #ff8a80; --ok: #9cff9c; --focus: #ffffff; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 600 var(--fs)/1.45 Nunito, "Segoe UI", system-ui, sans-serif; }
#app { max-width: 520px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
main { flex: 1; padding-block: 16px 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 16px; min-width: 0; }
h1, h2, h3, p, ul { margin: 0; } ul { padding: 0; list-style: none; }
h1 { font-size: 1.5em; font-weight: 900; line-height: 1.2; text-wrap: balance; }
h2 { font-size: 1.15em; font-weight: 800; }
h1:focus { outline: none; }
.muted { color: var(--muted); font-size: .92em; }
.center { text-align: center; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 8px; }
svg { width: 1.3em; height: 1.3em; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* topo */
.top { display: flex; align-items: center; gap: 8px; padding-block: 10px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); background: var(--bg); border-bottom: 2px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
.top h1 { flex: 1; font-size: 1.2em; min-width: 0; }
.ib { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-width: 48px; min-height: 48px; padding: 0 10px; border: 2px solid var(--teal); border-radius: 14px; background: var(--surface); color: var(--teal-d); font: inherit; font-weight: 800; font-size: .85em; cursor: pointer; }
.ib.on { background: var(--teal); color: var(--on-teal); }

/* botões */
.btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 56px; padding: 10px 18px; border: 2px solid transparent; border-radius: 999px; font: inherit; font-weight: 800; font-size: 1.05em; cursor: pointer; text-align: center; }
.btn.teal { background: var(--teal); color: var(--on-teal); }
.btn.orange { background: var(--orange); color: var(--tile-ink); border-color: var(--tile-ink); }
.btn.purple { background: var(--purple); color: #fff; } .hc .btn.purple { color: #000; }
.btn.ghost { background: var(--surface); color: var(--teal-d); border-color: var(--teal); }
.btn.danger { background: var(--surface); color: var(--danger); border-color: var(--danger); }
.btn.small { min-height: 48px; width: auto; font-size: .92em; padding: 6px 16px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.row > .btn { flex: 1 1 140px; }

/* capa */
.cover { background: #17616b; color: #fff; flex: 1; display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 28px 20px 0; text-align: center; }
.hc .cover { background: #000; }
.cover h1 { font-size: 2.5em; color: #ffc24a; letter-spacing: .01em; line-height: 1.05; }
.cover .lead { font-size: 1.1em; font-weight: 800; max-width: 17em; }
.cover .btn { max-width: 330px; font-size: 1.2em; }
.cover img { width: 100%; max-width: 420px; margin-top: auto; border-radius: 28px 28px 0 0; display: block; }
.cover a.mini { display: inline-flex; align-items: center; }
.cover .mini { background: none; border: 0; color: #fff; text-decoration: underline; font: inherit; min-height: 48px; cursor: pointer; }

/* início */
.hero { display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; }
.hero img { width: 150px; border-radius: 16px; mix-blend-mode: multiply; } .hc .hero img { mix-blend-mode: normal; }
.brand { font-size: 2.2em; font-weight: 900; color: var(--teal); letter-spacing: .04em; line-height: 1; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.tile { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; min-height: 150px; padding: 14px 10px; border: 3px solid transparent; border-radius: 22px; color: var(--tile-ink); font: inherit; font-weight: 900; font-size: 1.08em; line-height: 1.2; text-align: center; cursor: pointer; box-shadow: 0 3px 0 rgba(0,0,0,.12); }
.tile svg { width: 56px; height: 56px; stroke-width: 1.7; }
.t1 { background: var(--orange); } .t2 { background: var(--turq); } .t3 { background: var(--lilac); } .t4 { background: var(--pink); }
.hc .tile { border-color: #ffd600; box-shadow: none; }
.voicebar { display: flex; flex-wrap: wrap; gap: 10px; }
.voicebar .btn { flex: 1 1 150px; }
.tile, .tiles, .btn, h1, .brand { min-width: 0; overflow-wrap: anywhere; }

.fs2 .tile { font-size: .88em; padding-inline: 6px; }
@media (max-width: 360px) { .fs2 .tiles { grid-template-columns: 1fr; } .fs2 .tile { min-height: 110px; } }

.appcard { display: flex; align-items: center; gap: 12px; padding: 14px; border: 3px solid var(--teal); border-radius: 20px; background: var(--surface); color: var(--ink); text-decoration: none; min-width: 0; }
.appcard > span:nth-child(2) { flex: 1; min-width: 0; }
.appic { flex: none; width: 52px; height: 52px; border-radius: 14px; background: var(--teal); color: var(--on-teal); display: flex; align-items: center; justify-content: center; }
.appic svg { width: 30px; height: 30px; }
/* navegação */
nav.tabs { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surface); border-top: 2px solid var(--line); position: sticky; bottom: 0; padding-bottom: env(safe-area-inset-bottom, 0px); z-index: 5; }
nav.tabs button { display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 62px; padding: 8px 2px; border: 0; border-top: 4px solid transparent; background: none; color: var(--ink); font: inherit; font-size: .8em; font-weight: 800; cursor: pointer; }
nav.tabs button[aria-current="page"] { color: var(--teal-d); border-top-color: var(--teal); }

/* cartões e listas */
.card { background: var(--surface); border: 2px solid var(--line); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card.tint { background: #fff6e2; } .hc .card.tint { background: #000; }
.card h3 { font-size: 1.05em; font-weight: 800; overflow-wrap: anywhere; }
.card p { overflow-wrap: anywhere; }
.tag { display: inline-block; align-self: flex-start; padding: 2px 10px; border-radius: 999px; border: 2px solid var(--teal); color: var(--teal-d); font-size: .78em; font-weight: 800; }
.tag.ex { border-color: var(--muted); color: var(--muted); }
.list { display: flex; flex-direction: column; gap: 12px; }
.tel { font-size: 1.5em; font-weight: 900; color: var(--teal-d); }
.telrow { display: flex; align-items: center; gap: 12px; } .telrow > div { flex: 1; min-width: 0; }
.note { border-left: 6px solid var(--teal); padding: 8px 12px; background: var(--surface); border-radius: 10px; font-size: .9em; }
.msg { font-weight: 800; padding: 12px 14px; border-radius: 14px; border: 2px solid var(--ok); color: var(--ok); background: var(--surface); }
.msg.err { border-color: var(--danger); color: var(--danger); }

/* formulários */
form { display: flex; flex-direction: column; gap: 14px; }
.f { display: flex; flex-direction: column; gap: 6px; }
.f label, .lg { font-weight: 800; }
.inwrap { display: flex; border: 2px solid var(--muted); border-radius: 14px; background: var(--surface); overflow: hidden; }
.inwrap:focus-within { outline: 3px solid var(--focus); outline-offset: 2px; }
.inwrap input, .inwrap textarea, .inwrap select { flex: 1; min-width: 0; min-height: 54px; padding: 10px 12px; border: 0; background: transparent; color: var(--ink); font: inherit; outline: none; }
.inwrap textarea { min-height: 120px; resize: vertical; }
.mic { flex: none; width: 56px; min-height: 54px; border: 0; background: var(--orange); color: var(--tile-ink); cursor: pointer; display: flex; align-items: center; justify-content: center; }
.hc .mic { background: #ffd600; color: #000; }
.mic.rec { background: var(--danger); color: #fff; }
.sw { display: flex; align-items: center; gap: 12px; justify-content: space-between; width: 100%; min-height: 56px; padding: 8px 4px; border: 0; background: none; color: var(--ink); font: inherit; font-weight: 800; text-align: left; cursor: pointer; }
.sw i { flex: none; width: 58px; height: 32px; border-radius: 999px; background: #9aa5a8; position: relative; border: 2px solid var(--ink); }
.sw i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: left .15s; }
.sw[aria-checked="true"] i, .sw[aria-pressed="true"] i { background: var(--teal); } .sw[aria-checked="true"] i::after, .sw[aria-pressed="true"] i::after { left: 28px; }
.hc .sw i::after { background: #000; } .hc .sw i { background: #555; } .hc .sw[aria-checked="true"] i, .hc .sw[aria-pressed="true"] i { background: #ffd600; }
.prog { height: 12px; border-radius: 999px; border: 2px solid var(--ink); overflow: hidden; background: var(--surface); } .prog i { display: block; height: 100%; background: var(--teal); }
.opts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.opt { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 6px; min-height: 120px; border: 3px solid var(--line); border-radius: 16px; background: var(--surface); color: var(--ink); font: inherit; font-size: .85em; font-weight: 800; text-align: center; cursor: pointer; }
.opt svg { width: 40px; height: 40px; }
.opt[aria-checked="true"] { border-color: var(--teal); background: #e0f4f1; } .hc .opt[aria-checked="true"] { background: #000; border-color: #ffd600; color: #ffd600; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 48px; padding: 6px 14px; border: 2px solid var(--teal); border-radius: 999px; background: var(--surface); color: var(--teal-d); font: inherit; font-weight: 800; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--teal); color: var(--on-teal); }

/* tocador */
.player { position: sticky; bottom: 70px; background: var(--teal-d); color: var(--on-teal); border-radius: 18px; padding: 12px 14px; display: flex; align-items: center; gap: 10px; z-index: 4; }
.hc .player { border: 3px solid #ffd600; background: #000; color: #ffd600; }
.player p { flex: 1; min-width: 0; font-size: .9em; }
.player button { flex: none; min-width: 48px; min-height: 48px; border: 2px solid currentColor; border-radius: 12px; background: none; color: inherit; cursor: pointer; font: inherit; font-weight: 800; }
.qr { align-self: center; background: #fff; padding: 12px; border-radius: 12px; border: 2px solid var(--line); line-height: 0; }
.qr svg { width: 200px; height: 200px; stroke: none; }
.code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 1.2em; font-weight: 800; letter-spacing: .08em; text-align: center; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (max-width: 340px) { .opts { grid-template-columns: 1fr; } .opt { min-height: 0; flex-direction: row; justify-content: flex-start; text-align: left; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  if (m) { var i = MESES.indexOf(m[2]); if (i >= 0) return ('0' + m[1]).slice(-2) + '/' + ('0' + (i + 1)).slice(-2) + '/' + m[3]; }

      '<div class="row"><button class="btn ghost small" data-a="falaOk" data-v="' + esc(f.id) + '">' + I('check') + '<span>' + (f.ok ? 'Reabrir' : 'Marcar como resolvido') + '</span></button>' +
      '<button class="btn danger small" data-a="delFala" data-v="' + esc(f.id) + '" aria-label="Apagar protocolo ' + esc(f.prot) + '">' + I('trash') + '</button></div></li>'; }).join('') + '</ul>'
    : '<p class="muted" data-say>Você ainda não registrou nenhuma fala.</p>';
  return h + '<p class="note" data-say>Nesta versão a fala fica guardada neste aparelho. O envio ao Conselho Popular acontece quando o servidor local da comunidade estiver ligado.</p></main>' + tabs();
};
V.mensagens = function () {
  var list = [];
  D.falas.forEach(function (f) { list.push({ ts: f.ts, t: 'Fala registrada', x: 'Sua fala sobre ' + f.cat.toLowerCase() + ' recebeu o protocolo ' + f.prot + '. Situação: ' + (f.ok ? 'resolvido' : 'registrada') + '.' }); });
  D.avisos.forEach(function (a) { list.push({ ts: a.ts, t: 'Aviso publicado na rádio', x: a.titulo }); });
  D.cultura.forEach(function (c) { list.push({ ts: c.ts, t: 'Sugestão de cultura enviada', x: c.titulo }); });
  list.sort(function (a, b) { return b.ts - a.ts; });
  if (D.user) list.push({ ts: D.user.ts, t: 'Bem-vindo(a) à PACA', x: 'Seu cadastro foi criado sem biometria. Seus dados ficam só neste aparelho.' });
  return top('Mensagens', true) + '<main>' + msgBox() + (list.length ? '<ul class="list">' + list.map(function (m) {
    return '<li class="card"><h3 data-say>' + esc(m.t) + '</h3><p data-say>' + esc(m.x) + '</p><p class="muted">' + when(m.ts) + '</p></li>'; }).join('') + '</ul>' : '<p data-say>Nenhuma mensagem por enquanto.</p>') + '</main>' + tabs();
};
function qrSvg(text) {
  try {
    if (!window.qrcode) return '';
    var q = window.qrcode(0, 'M'); q.addData(text); q.make();
    var n = q.getModuleCount(), p = '';
    for (var r = 0; r < n; r++) for (var c = 0; c < n; c++) if (q.isDark(r, c)) p += 'M' + c + ' ' + r + 'h1v1h-1z';
    return '<svg viewBox="-1 -1 ' + (n + 2) + ' ' + (n + 2) + '" role="img" aria-label="Código QR pessoal"><path d="' + p + '" fill="#000" stroke="none"/></svg>';
  } catch (e) { return ''; }
}
V.perfil = function () {
  var u = D.user, m = { rfid: 'Cartão RFID comunitário', qr: 'Código QR pessoal', ponto: 'Ponto de atendimento físico' };
  var h = top('Perfil', true) + '<main>' + msgBox();
  if (u) {
    h += '<section class="card"><h2 data-say>' + esc(u.nome) + '</h2><p class="muted" data-say>' + esc((u.bairro ? 'Comunidade: ' + u.bairro + '. ' : '') + 'Identificação: ' + m[u.metodo] + '.') + '</p>';
    if (u.metodo === 'qr') { var q = qrSvg(u.codigo); h += (q ? '<div class="qr">' + q + '</div>' : '') + '<p class="code" data-say="' + esc('Seu código: ' + u.codigo.split('').join(' ')) + '">' + esc(u.codigo) + '</p><p class="muted center">Mostre este código no atendimento. Ele não carrega seu nome nem outros dados.</p>'; }
    else if (u.metodo === 'rfid') h += '<p class="code">' + esc(u.codigo) + '</p><p class="muted" data-say>Informe este código no ponto de atendimento da comunidade para retirar o seu cartão.</p>';
    else h += '<p class="code">' + esc(u.codigo) + '</p><p class="muted" data-say>Informe este código no ponto de atendimento físico. Lá, uma pessoa da comunidade ajuda você a usar os serviços.</p>';
    h += '</section>';
  }
  h += '<section class="card"><h2 data-say>Acessibilidade</h2>' + sw('hc', 'Alto contraste (fundo preto)', D.acc.hc) + sw('auto', 'Ler cada tela em voz alta ao abrir', D.acc.auto) +
    '<p class="lg" id="lg-fs">Tamanho da letra</p><div class="chips" role="group" aria-labelledby="lg-fs">' + ['Normal', 'Grande', 'Muito grande'].map(function (x, i) {
      return '<button class="chip" aria-pressed="' + (D.acc.fs === i ? 'true' : 'false') + '" data-a="fs" data-v="' + i + '">' + x + '</button>'; }).join('') + '</div>' +
    '<p class="lg" id="lg-r">Velocidade da voz</p><div class="chips" role="group" aria-labelledby="lg-r">' + [[0.8, 'Devagar'], [1, 'Normal'], [1.2, 'Rápida']].map(function (r) {
      return '<button class="chip" aria-pressed="' + (D.acc.rate === r[0] ? 'true' : 'false') + '" data-a="rate" data-v="' + r[0] + '">' + r[1] + '</button>'; }).join('') + '</div>' +
    '<button class="btn ghost" data-a="testVoice">' + I('ear') + '<span>Testar a voz</span></button></section>';
  if (!standalone()) {
    h += '<section class="card"><h2 data-say>Aplicativo</h2>' +
      (APK ? '<p class="muted" data-say>No Android, baixe o aplicativo da PACA. Ao abrir o arquivo, o celular pede para permitir a instalação.</p><a class="btn teal" href="' + APK + '" download="PACA.apk">' + I('arrow') + '<span>Baixar para Android (APK)</span></a>' : '') +
      (S.install ? '<button class="btn ghost" data-a="install">' + I('plus') + '<span>Instalar na tela inicial</span></button>' : '') +
      '<p class="muted" data-say>No iPhone, abra no Safari, toque em Compartilhar e depois em Adicionar à Tela de Início.</p></section>';
  }
  h += '<section class="card"><h2 data-say>Sobre a PACA</h2><p data-say>PACA é a Plataforma Comunitária Aberta de Autoria: um aplicativo feito com a comunidade, que une comunicação, inclusão, cultura e governança.</p>' +
    '<p data-say><strong>Para quê?</strong> Para dar voz e acesso a quem a tecnologia costuma deixar de fora.</p><p data-say><strong>Para quem?</strong> Para os moradores, inclusive quem não lê, enxerga pouco ou tem pouca internet.</p>' +
    '<p data-say><strong>Com quais consequências?</strong> Coleta mínima de dados, sem biometria, com os dados sob controle da própria comunidade.</p></section>';
  h += '<section class="card"><h2 data-say>Privacidade</h2><p class="muted" data-say>' + (storeOk ? 'Tudo fica guardado só neste aparelho. Nada é enviado para fora.' : 'Este navegador não deixou guardar os dados: eles somem ao fechar a página.') + '</p>' +
    (u ? '<button class="btn ghost" data-a="logout">Sair</button>' : '') + '<button class="btn danger" data-a="wipeAsk">' + I('trash') + '<span>Apagar todos os meus dados</span></button></section>';
  return h + '</main>' + tabs();
};
V.wipe = function () {
  return top('Apagar os dados') + '<main><p data-say>Isso apaga o seu cadastro, os avisos, as sugestões e as falas guardados neste aparelho. Não dá para desfazer.</p>' +
    '<button class="btn danger" data-a="wipeNow">' + I('trash') + '<span>Apagar tudo</span></button><button class="btn ghost" data-a="back">Cancelar</button></main>';
};

/* ---------- rádio ---------- */
function stopRadio(silent) { if (S.play) { S.play = null; hush(); if (!silent) render(); } }
function playAt(i, single) {
  var list = avisos();
  if (i >= list.length) { S.play = null; render(); say('Fim dos avisos da Rádio Comunidade.'); return; }
  var token = {}; S.play = { i: i, token: token, single: !!single };
  render();
  var a = list[i], intro = single ? '' : (i === 0 ? 'Rádio Comunidade PACA. ' : 'Próximo aviso. ');
  var ok = say(intro + a.titulo + '. ' + a.texto, function (done) {
    if (!S.play || S.play.token !== token) return;
    if (!done || single) { S.play = null; render(); return; }
    playAt(i + 1);
  });
  if (!ok) { S.play = null; render(); }
}

/* ---------- ações ---------- */
var A = {
  go: function (v) { go(v); return false; },
  tab: function (v) { S.back = []; go(v, true); return false; },
  back: function () { hush(); stopRadio(true); S.scr = S.back.pop() || (D.logged ? 'home' : 'capa'); S.tmp = {}; S.focus = true; },
  enter: function () { S.back = []; go(!D.user ? 'cad1' : (D.logged ? 'home' : 'login'), true); return false; },
  readScreen: function () { var t = screenText(); if (synth && synth.speaking) { hush(); return false; } say(t); return false; },
  sayText: function (v) { say(v); return false; },
  testVoice: function () { say('Olá! Esta é a voz da PACA. Sua comunidade em suas mãos.'); return false; },
  accQuick: function () { keep(); var on = !D.acc.hc; D.acc.hc = on; D.acc.fs = on ? 1 : 0; D.acc.auto = on; save(); applyAcc(); if (on) say('Modo de acessibilidade visual ativado: alto contraste, letra grande e leitura das telas em voz alta.'); },
  hc: function () { D.acc.hc = !D.acc.hc; save(); applyAcc(); },
  auto: function () { D.acc.auto = !D.acc.auto; save(); if (!D.acc.auto) hush(); },
  fs: function (v) { D.acc.fs = +v; save(); applyAcc(); },
  rate: function (v) { D.acc.rate = +v; save(); },
  metodo: function (v) { keep(); S.tmp.metodo = v; },
  tipo: function (v) { keep(); S.tmp.tipo = v; },
  cat: function (v) { keep(); S.tmp.cat = v; },
  anon: function () { keep(); S.tmp.anon = !S.tmp.anon; },
  mic: function (id) {
    keep(); S.rec = id; render();
    listen(function (t) {
      S.rec = null;
      if (id === 'nasc') { var d = spokenDate(t); if (d) S.tmp.nasc = d; else flash('Não entendi a data. Diga, por exemplo: 12 de março de 1990.', true); }
      else if (id === 'chave') S.tmp[id] = t.trim();
      else { var cur = (S.tmp[id] || '').trim(), el = $(id), area = el && el.tagName === 'TEXTAREA'; t = t.charAt(0).toUpperCase() + t.slice(1); S.tmp[id] = area && cur ? cur + ' ' + t : t; }
      S.focusId = id; render();
    });
    return false;
  },
  voiceCmd: function () { S.rec = 'cmd'; render(); listen(function (t) { S.rec = null; command(t); }); return false; },
  radioPlay: function () { if (S.play) stopRadio(); else playAt(0); return false; },
  radioOne: function (v) { playAt(+v, true); return false; },
  radioNext: function () { if (S.play) playAt(S.play.i + 1); return false; },
  previewAviso: function () { keep(); var t = [val('av-t'), val('av-x')].filter(Boolean).join('. '); if (!t) flash('Escreva ou fale o texto primeiro.', true); else { say(t); return false; } },
  delAviso: function (v) { stopRadio(true); D.avisos = D.avisos.filter(function (x) { return x.id !== v; }); save(); flash('Aviso apagado.'); },
  delServ: function (v) { D.servicos = D.servicos.filter(function (x) { return x.id !== v; }); save(); flash('Serviço apagado.'); },
  delCult: function (v) { D.cultura = D.cultura.filter(function (x) { return x.id !== v; }); delete D.apoio[v]; save(); flash('Sugestão apagada.'); },
  delFala: function (v) { D.falas = D.falas.filter(function (x) { return x.id !== v; }); save(); flash('Fala apagada.'); },
  falaOk: function (v) { D.falas.forEach(function (x) { if (x.id === v) x.ok = !x.ok; }); save(); },
  apoiar: function (v) { if (D.apoio[v]) delete D.apoio[v]; else D.apoio[v] = 1; save(); announce(D.apoio[v] ? 'Você apoia esta sugestão.' : 'Apoio retirado.'); },
  logout: function () { D.logged = false; save(); S.back = []; S.scr = 'capa'; S.focus = true; },
  install: function () { var ev = S.install; if (!ev) return; S.install = null; try { ev.prompt(); } catch (e) {} },
  wipeAsk: function () { go('wipe'); return false; },
  wipeNow: function () { var acc = D.acc; D = blank(); D.acc = acc; save(); S.back = []; S.scr = 'capa'; S.focus = true; flash('Dados apagados.'); }
};
var F = {
  cad1: function () {
    var n = val('nome'), b = val('bairro'), d = val('nasc');
    if (n.length < 2) return err('Diga ou escreva o seu nome.', 'nome');
    if (d && !/^\d{2}\/\d{2}\/\d{4}$/.test(d)) return err('Escreva a data assim: dia, mês e ano. Exemplo: 12/03/1990. Ou deixe em branco.', 'nasc');
    S.reg = { nome: n.slice(0, 80), bairro: b.slice(0, 60), nasc: d };
    go('cad2');
  },
  cad2: function () {
    var k = val('chave'), m = S.tmp.metodo || 'qr';
    if (k.length < 4) return err('A chave de acesso precisa de 4 letras ou mais.', 'chave');
    if (!S.reg) { go('cad1'); return; }
    var salt = uid(), u = S.reg;
    hashKey(k, salt).then(function (h) {
      D.user = { nome: u.nome, bairro: u.bairro, nasc: u.nasc, metodo: m, codigo: 'PACA-' + Math.random().toString(36).slice(2, 6).toUpperCase() + '-' + Math.random().toString(36).slice(2, 6).toUpperCase(), salt: salt, hash: h, ts: Date.now() };
      D.logged = true; S.reg = null; save(); S.back = []; flash('Cadastro concluído. Bem-vindo(a)!'); go('home', true);
    });
  },
  login: function () {
    var k = val('chave');
    if (!D.user.hash) { D.logged = true; save(); go('home', true); return; }
    hashKey(k, D.user.salt).then(function (h) {
      if (h && h === D.user.hash) { D.logged = true; save(); S.back = []; go('home', true); }
      else { S.tmp = {}; flash('A chave não confere. Tente de novo.', true); S.focusId = 'chave'; render(); }
    });
  },
  aviso: function () {
    var t = val('av-t'), x = val('av-x');
    if (x.length < 5) return err('Escreva ou fale o texto do aviso.', 'av-x');
    D.avisos.push({ id: uid(), titulo: (t || x.split(/[.!?]/)[0]).slice(0, 70), texto: x.slice(0, 800), autor: D.user ? D.user.nome.split(' ')[0] : 'Morador', ts: Date.now() });
    save(); S.back.pop(); flash('Aviso publicado na rádio.'); go('radio', true);
  },
  serv: function () {
    var n = val('sv-n'), d = val('sv-d');
    if (n.length < 2) return err('Diga o nome do serviço.', 'sv-n');
    if (d.length < 3) return err('Conte o que o serviço oferece.', 'sv-d');
    D.servicos.push({ id: uid(), nome: n.slice(0, 60), desc: d.slice(0, 300), onde: val('sv-o').slice(0, 120), cat: 'Da comunidade', ts: Date.now() });
    save(); S.back.pop(); flash('Serviço cadastrado.'); go('servicos', true);
  },
  cult: function () {
    var t = val('ct-t'), x = val('ct-x'), tipo = S.tmp.tipo || TIPOS[0];
    if (t.length < 2) return err('Dê um título para a sugestão.', 'ct-t');
    if (x.length < 5) return err('Conte a sua ideia.', 'ct-x');
    D.cultura.push({ id: uid(), tipo: tipo, titulo: t.slice(0, 70), texto: x.slice(0, 500), autor: D.user ? D.user.nome.split(' ')[0] : 'Morador', ts: Date.now() });
    save(); S.back.pop(); flash('Sugestão enviada. Obrigado!'); go('cultura', true);
  },
  fala: function () {
    var c = S.tmp.cat, o = val('fl-o'), x = val('fl-x'), anon = !!S.tmp.anon;
    if (!c) return err('Escolha o assunto.');
    if (x.length < 5) return err('Conte o que está acontecendo.', 'fl-x');
    var prot = new Date().getFullYear() + '-' + ('000' + (D.falas.length + 1)).slice(-4) + '-' + Math.random().toString(36).slice(2, 5).toUpperCase();
    D.falas.push({ id: uid(), cat: c, onde: o.slice(0, 100) || 'Local não informado', texto: x.slice(0, 600), anon: anon, prot: prot, ok: false, ts: Date.now() });
    save(); S.tmp = {}; flash('Fala registrada. Protocolo ' + prot + '.'); S.focus = true; render();
    say('Fala registrada. Seu protocolo é ' + prot.split('').join(' '));
  }
};
function err(t, id) { keep(); flash(t, true); if (id) S.focusId = id; render(); if (D.acc.auto) say(t); }

/* ---------- desenhar ---------- */
function render() {
  var guard = { cad2: !!S.reg, login: !!D.user && !D.logged };
  var open = ['capa', 'cad1', 'cad2', 'login', 'wipe'];
  if (open.indexOf(S.scr) < 0 && !D.logged) S.scr = 'capa';
  if (S.scr in guard && !guard[S.scr]) S.scr = D.logged ? 'home' : 'capa';
  var y = window.scrollY, app = $('app');
  app.innerHTML = (V[S.scr] || V.capa)();
  document.title = 'PACA';
  if (S.focusId) { var f = $(S.focusId); S.focusId = null; if (f) f.focus(); }
  else if (S.focus) { window.scrollTo(0, 0); var h = $('h'); if (h) h.focus({ preventScroll: true }); if (D.acc.auto) setTimeout(function () { if (!S.play) say(screenText()); }, 250); }
  else window.scrollTo(0, y);
  S.focus = false;
}
document.addEventListener('click', function (ev) {
  var el = ev.target.closest ? ev.target.closest('[data-a]') : null;
  if (!el) return;
  var fn = A[el.getAttribute('data-a')];
  if (!fn) return;
  if (el.tagName !== 'A') ev.preventDefault();
  var r = fn(el.getAttribute('data-v'));
  if (r !== false) render();
});
document.addEventListener('submit', function (ev) {
  var f = ev.target.closest ? ev.target.closest('form[data-f]') : null;
  if (!f) return;
  ev.preventDefault();
  var fn = F[f.getAttribute('data-f')];
  if (fn) fn();
});
document.addEventListener('input', function (ev) {
  var el = ev.target;
  if (el && el.id === 'nasc') { var d = el.value.replace(/\D/g, '').slice(0, 8); el.value = d.length > 4 ? d.slice(0, 2) + '/' + d.slice(2, 4) + '/' + d.slice(4) : (d.length > 2 ? d.slice(0, 2) + '/' + d.slice(2) : d); }
});
window.addEventListener('pagehide', hush);
window.addEventListener('beforeinstallprompt', function (ev) { ev.preventDefault(); S.install = ev; if (S.scr === 'perfil') render(); });
applyAcc();
S.focus = false;
render();
})();
</script>
