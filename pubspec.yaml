name: telatchau
description: "TelaTchau — Menos tela. Mais estudo e movimento. App escolar para trocar tempo de celular por estudo e atividade física."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Único plugin: guarda os dados do app em JSON, localmente, sem conta e sem internet.
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
