name: foquinho
description: "Foquinho — Menos tela. Mais estudo e movimento. App escolar para trocar tempo de celular por estudo e atividade física."
publish_to: "none"
version: 1.6.0+10

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Guarda os dados do app em JSON, localmente, sem conta e sem internet.
  shared_preferences: ^2.3.0
  # Notificações e alarme agendados no próprio aparelho (sem servidor).
  flutter_local_notifications: 17.2.4
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Gera os ícones do app (Android, iOS e web) a partir de assets/icon/.
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0F6E56"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#0F6E56"
    theme_color: "#0F6E56"

flutter:
  uses-material-design: true
  assets:
    - assets/foquinha/
