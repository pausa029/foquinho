# Lembra Aí: testa o cálculo dos avisos, compila o APK e publica em Releases.
# Roda a cada envio que mexe em lembra-ai/ (ou em "Run workflow" na aba Actions).
name: Lembra Aí — APK

on:
  push:
    branches: [main, ccr-2d08cc0a-knopf2]
    paths:
      - "lembra-ai/**"
      - ".github/workflows/lembra-ai.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lembra-ai-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Testar e compilar
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: lembra-ai
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Testes do cálculo dos avisos
        run: chmod +x gradlew && ./gradlew --no-daemon :core:test

      - name: Chave de publicação (só se estiver nos Secrets do repositório)
        env:
          CHAVE_B64: ${{ secrets.LEMBRA_KEYSTORE_B64 }}
          CHAVE_SENHA: ${{ secrets.LEMBRA_KEYSTORE_SENHA }}
          CHAVE_ALIAS: ${{ secrets.LEMBRA_KEY_ALIAS }}
        run: |
          if [ -n "$CHAVE_B64" ]; then
            echo "$CHAVE_B64" | base64 -d > "$RUNNER_TEMP/lembra.jks"
            {
              echo "LEMBRA_KEYSTORE=$RUNNER_TEMP/lembra.jks"
              echo "LEMBRA_KEYSTORE_SENHA=$CHAVE_SENHA"
              echo "LEMBRA_KEY_ALIAS=${CHAVE_ALIAS:-lembra}"
              echo "LEMBRA_KEY_SENHA=$CHAVE_SENHA"
            } >> "$GITHUB_ENV"
            echo "APK assinado com a chave privada (Secrets)."
          else
            echo "::warning::APK assinado com a chave de TESTE, que é pública no repositório. Veja 'Segurança' no README do Lembra Aí."
          fi

      - name: Compilar o APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Guardar relatório dos testes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lembra-ai-testes
          path: lembra-ai/core/build/reports/tests/test/
          if-no-files-found: ignore

      - name: Guardar o APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: LembraAi-apk
          path: lembra-ai/app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar em Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="lembra-ai-v1.0.${{ github.run_number }}"
          cp app/build/outputs/apk/debug/app-debug.apk LembraAi.apk
          gh release create "$TAG" LembraAi.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Lembra Aí 1.0.${{ github.run_number }}" \
            --latest=false \
            --notes "APK do Lembra Aí, pronto para instalar no Android 8 ou mais novo. Baixe o arquivo LembraAi.apk abaixo, abra no celular e toque em Instalar. Se pedir, permita instalar apps desta fonte."
          # Endereço fixo do APK mais recente (usado pela página de compromisso enviado e pelo botão "Atualize").
          gh release delete lembra-ai-ultimo --repo "${{ github.repository }}" --yes --cleanup-tag || true
          gh release create lembra-ai-ultimo LembraAi.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Lembra Aí (versão mais recente)" \
            --latest=false \
            --notes "Sempre o APK mais recente do Lembra Aí. Endereço fixo: releases/download/lembra-ai-ultimo/LembraAi.apk"
