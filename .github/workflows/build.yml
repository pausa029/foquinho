# Compila o Foquinho na nuvem do GitHub (de graça):
#  - APK de depuração (instala direto no Android)
#  - AAB de publicação (assinatura de teste; veja README para assinar de verdade)
#  - Versão web, publicada no GitHub Pages (para iPhone e qualquer navegador)
#
# Para rodar: basta enviar código para a branch main, ou usar "Run workflow" na aba Actions.

name: Build Foquinho

on:
  push:
    branches: [main]
  workflow_dispatch:

# Por padrão, só leitura. Cada tarefa pede só o que precisa (veja "permissions" em cada uma).
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar Android e Web
    runs-on: ubuntu-latest
    permissions:
      contents: write   # publicar o APK em Releases e enviar as pastas geradas
    timeout-minutes: 45
    steps:
      - name: Baixar o código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Instalar Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Flutter (versão fixa, para o build ser reproduzível)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: "3.27.4"
          cache: true

      - name: Gerar as pastas android/, ios/ e web/ (o código do app fica em lib/)
        run: |
          flutter create --org com.pausa029 --project-name foquinho --platforms android,ios,web .
          # Nome visível do app e versão mínima do Android.
          sed -i 's/android:label="foquinho"/android:label="Foquinho"/' android/app/src/main/AndroidManifest.xml
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            if [ -f "$f" ]; then
              sed -i 's/flutter\.minSdkVersion/21/' "$f"
            fi
          done
          # Nome do app na versão web (aba do navegador e "Adicionar à tela de início").
          sed -i 's/<title>foquinho<\/title>/<title>Foquinho<\/title>/' web/index.html || true
          sed -i 's/"name": "foquinho"/"name": "Foquinho"/; s/"short_name": "foquinho"/"short_name": "Foquinho"/' web/manifest.json || true
          sed -i 's/"description": "A new Flutter project."/"description": "Estude no seu ritmo."/' web/manifest.json || true

      - name: Baixar dependências
        run: flutter pub get

      - name: Chave de publicação (só se estiver nos Secrets do repositório)
        env:
          CHAVE_B64: ${{ secrets.FOQUINHO_KEYSTORE_B64 }}
          CHAVE_SENHA: ${{ secrets.FOQUINHO_KEYSTORE_SENHA }}
          CHAVE_ALIAS: ${{ secrets.FOQUINHO_KEY_ALIAS }}
        run: |
          if [ -n "$CHAVE_B64" ]; then
            echo "$CHAVE_B64" | base64 -d > "$RUNNER_TEMP/foquinho.jks"
            {
              echo "FOQUINHO_KEYSTORE=$RUNNER_TEMP/foquinho.jks"
              echo "FOQUINHO_KEYSTORE_SENHA=$CHAVE_SENHA"
              echo "FOQUINHO_KEY_ALIAS=${CHAVE_ALIAS:-upload}"
            } >> "$GITHUB_ENV"
            echo "APK assinado com a chave privada (Secrets)."
          else
            echo "::warning::APK assinado com a chave de TESTE, que é pública no repositório. Veja 'Segurança' no README."
          fi

      - name: Gerar os ícones do app (Android, iOS e web)
        continue-on-error: true
        run: dart run flutter_launcher_icons

      - name: Analisar o código (não bloqueia o build)
        continue-on-error: true
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.txt || { bash tool/annotate.sh analyze.txt ' error •|^error' 'Erros da análise'; exit 1; }

      - name: Rodar os testes (não bloqueia o build; veja o log)
        continue-on-error: true
        run: |
          set -o pipefail
          flutter test 2>&1 | tee test.txt || { bash tool/annotate.sh test.txt '\[E\]|Expected:|Actual:|Which:|Error:|error:|Some tests failed|_test\.dart [0-9]+:' 'Testes que falharam'; exit 1; }

      - name: Compilar APK
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.txt || { bash tool/annotate.sh build.txt 'Error:|error:|FAILURE|What went wrong|lib/.*\.dart:[0-9]+' 'Erros da compilação'; exit 1; }
          cp build/app/outputs/flutter-apk/app-release.apk Foquinho-universal.apk

      - name: Compilar APK leve (só celulares 64 bits, quase todos hoje)
        continue-on-error: true
        run: |
          flutter build apk --release --target-platform android-arm64
          cp build/app/outputs/flutter-apk/app-release.apk Foquinho.apk

      - name: Compilar AAB (assinado com chave de teste)
        continue-on-error: true
        run: flutter build appbundle --release

      - name: Compilar versão web
        continue-on-error: true
        run: flutter build web --release --base-href "/web/" --pwa-strategy=none --no-web-resources-cdn

      - name: Montar o site (apresentação na raiz, app web em /web/, versão Flutter em /app/)
        run: |
          mkdir -p site/web site/app
          cp -r web_site/. site/
          # A versão web é o mesmo app do APK (Flutter). /app/ antigo leva para /web/.
          if [ -f build/web/main.dart.js ]; then rm -rf site/web && mkdir -p site/web && cp -r build/web/. site/web/; fi
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=../web/"><a href="../web/">Abrir o Foquinho</a>' > site/app/index.html
          touch site/.nojekyll

      - name: Proteger as páginas (CSP, anti-clickjacking, referrer)
        run: python3 tool/seguranca_site.py site

      - name: Guardar o APK para download
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: foquinho-apk
          path: Foquinho*.apk
          if-no-files-found: error

      - name: Publicar o APK em Releases (link público, sem precisar de login)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f Foquinho.apk ] || cp Foquinho-universal.apk Foquinho.apk
          ls -la Foquinho*.apk
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest Foquinho.apk Foquinho-universal.apk \
            --title "Foquinho — APK (última versão)" \
            --notes "APK gerado automaticamente pelo GitHub Actions (commit ${{ github.sha }}). Para instalar: baixe no Android, abra o arquivo e permita a instalação. Foquinho.apk = versão leve (celulares 64 bits). Se der erro de instalação, use Foquinho-universal.apk."

      - name: Guardar o AAB para download
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: foquinho-aab-release
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: warn

      - name: Enviar as pastas geradas (android/, ios/, web/) de volta ao repositório
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android ios web .metadata 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: pastas de plataforma geradas pelo Flutter 3.27.4"
            git push
          fi

      - name: Preparar o site para o GitHub Pages
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

  deploy-web:
    name: Publicar site (GitHub Pages)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Ativar o GitHub Pages do repositório (se ainda não estiver)
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
