<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Compromisso para você · Lembra Aí</title>
<meta name="description" content="Alguém marcou um compromisso para você no Lembra Aí. Toque para salvar na sua agenda.">
<meta name="theme-color" content="#0b3d91">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Página-ponte: abre o compromisso no app Lembra Aí. Os dados ficam depois do "#" e não passam por servidor. */
:root {
  color-scheme: light;
  --fundo: #fffdf7; --papel: #fff; --tinta: #111; --suave: #3a3a3a;
  --azul: #0b3d91; --azul-claro: #dde8fb; --verde: #1b5e20; --amarelo: #ffe082; --amarelo-borda: #b26a00; --borda: #5a5a5a;
  --texto: "Atkinson Hyperlegible", "Segoe UI", Roboto, Arial, sans-serif;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box }
html, body { margin: 0; background: var(--fundo); color: var(--tinta) }
body { font: 22px/1.4 var(--texto) }
header { background: var(--azul); color: #fff }
header div, main { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
header div { padding-block: 14px; font-weight: 700; font-size: 1.2em }
main { display: flex; flex-direction: column; gap: 16px; padding-block: 18px 40px }
h1 { margin: 0; font-size: 1.5em; line-height: 1.2; text-wrap: balance }
p { margin: 0 }
.quando { color: var(--azul); font-weight: 700; font-size: 1.15em }
.caixa { background: var(--papel); border: 2px solid var(--borda); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 10px }
.caixa h2 { margin: 0; font-size: 1.05em; color: var(--azul) }
.de { background: var(--azul-claro); border-radius: 12px; padding: 12px 14px; font-weight: 700 }
.aviso { background: var(--amarelo); border: 3px solid var(--amarelo-borda); border-radius: 14px; padding: 14px; font-weight: 700 }
.b { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 72px; border-radius: 14px; border: 3px solid var(--azul);
  background: var(--azul); color: #fff; font: 700 1.05em/1.2 var(--texto); text-align: center; text-decoration: none; padding: 10px 14px; cursor: pointer }
.b.verde { background: var(--verde); border-color: var(--verde); min-height: 92px; font-size: 1.25em }
.b.contorno { background: var(--papel); color: var(--azul) }
ol { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 8px }
.suave { color: var(--suave); font-size: .85em }
code { font-size: .7em; word-break: break-all; color: var(--suave) }
:focus-visible { outline: 4px solid #d84315; outline-offset: 2px }
</style>
</head>
<body>
<header><div>🔔 Lembra Aí</div></header>
<main id="app">
  <h1>Abrindo o compromisso…</h1>
</main>
<script>
'use strict';
const PACOTE = 'com.pausa029.lembraai';
const APK = 'https://github.com/pausa029/foquinho/releases/download/lembra-ai-ultimo/LembraAi.apk';
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const SEM = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const hora = m => { const h = Math.floor(m / 60), mm = m % 60; return mm ? `${h}h${String(mm).padStart(2, '0')}` : `${h}h`; };
const ler = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const dataCompleta = k => { const d = ler(k); return `${SEM[d.getDay()]}, ${d.getDate()} de ${MESES[d.getMonth()]} de ${d.getFullYear()}`; };
const cap = s => s[0].toUpperCase() + s.slice(1);
const juntar = l => l.length < 2 ? (l[0] || '') : l.slice(0, -1).join(', ') + ' e ' + l[l.length - 1];
const plural = (n, a, b) => `${n} ${n === 1 ? a : b}`;
function duracao(t) {
  const d = Math.floor(t / 1440), h = Math.floor((t % 1440) / 60), m = t % 60, p = [];
  if (d) p.push(plural(d, 'dia', 'dias')); if (h) p.push(plural(h, 'hora', 'horas')); if (m && !d) p.push(plural(m, 'minuto', 'minutos'));
  return juntar(p);
}
const intervalo = m => m % 60 === 0 ? `de ${m / 60} em ${m / 60} ${m === 60 ? 'hora' : 'horas'}` : m < 60 ? `de ${m} em ${m} minutos` : `de ${hora(m)} em ${hora(m)}`;

function comoAvisar(o, min) {
  const j = o.j || [420, 1320], da = o.da ?? 1;
  const ini = ler(o.d); ini.setDate(ini.getDate() - da);
  const desde = da <= 0 ? 'Vou te avisar no próprio dia' : da <= 6 ? `Vou te avisar desde ${SEM[ini.getDay()].split('-')[0]}` : `Vou te avisar desde ${ini.getDate()} de ${MESES[ini.getMonth()]}`;
  let fr;
  if (o.fm === 'V') fr = `${o.fv === 1 ? '1 vez' : o.fv + ' vezes'} por dia, das ${hora(j[0])} às ${hora(j[1])}`;
  else if (o.fm === 'H') { const h = (o.fh || []).filter(x => x >= j[0] && x <= j[1]); fr = h.length ? 'às ' + juntar(h.map(hora)) : 'sem avisos repetidos'; }
  else fr = `${intervalo(Math.max(15, o.fi || 60))}, das ${hora(j[0])} às ${hora(j[1])}`;
  const esp = [...new Set(o.an || [])].filter(m => m > 0).sort((a, b) => b - a).map(m => duracao(m) + ' antes').concat(o.nh !== false ? ['na hora'] : []);
  return `${desde}, ${fr}${esp.length ? ', e também ' + juntar(esp) + '.' : '.'}`;
}

async function decodificar(codigo) {
  const m = /LA(\d{1,3})\.([A-Za-z0-9_-]{8,})/.exec(codigo || '');
  if (!m) return { erro: 'quebrado' };
  if (+m[1] > 1) return { erro: 'versao' };
  if (typeof DecompressionStream === 'undefined') return { codigo: m[0] };
  try {
    const b64 = m[2].replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((m[2].length + 3) % 4);
    const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    const txt = await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate'))).text();
    const o = JSON.parse(txt);
    if (!o || typeof o.t !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(o.d) || !/^\d{2}:\d{2}$/.test(o.h)) return { erro: 'quebrado' };
    if (o.v > 1) return { erro: 'versao' };
    return { codigo: m[0], o };
  } catch (e) { return { erro: 'quebrado' }; }
}

function baixar() {
  return `<section class="caixa"><h2>Ainda não tem o Lembra Aí?</h2>
    <a class="b contorno" href="${APK}">⬇ BAIXAR O LEMBRA AÍ</a>
    <ol><li>Toque em <b>BAIXAR</b> e espere terminar.</li><li>Abra o arquivo <b>LembraAi.apk</b>.</li>
    <li>Se o celular pedir, toque em <b>Configurações</b> e ligue <b>Permitir desta fonte</b>.</li>
    <li>Toque em <b>Instalar</b>. Depois volte para o WhatsApp e toque no link de novo.</li></ol></section>`;
}

async function iniciar() {
  const app = document.getElementById('app');
  const r = await decodificar(decodeURIComponent(location.hash.slice(1)));
  if (r.erro === 'versao') {
    app.innerHTML = `<h1>Atualize o Lembra Aí</h1><p>Este compromisso foi feito numa versão mais nova do app. Instale a versão nova e toque no link de novo.</p><a class="b verde" href="${APK}">⬇ BAIXAR A VERSÃO NOVA</a>`;
    return;
  }
  if (r.erro) {
    app.innerHTML = `<h1>Não consegui ler este compromisso</h1><p>Peça para enviarem de novo.</p>`;
    return;
  }
  const android = /Android/i.test(navigator.userAgent);
  const semApp = new URLSearchParams(location.search).has('semapp');
  const fallback = location.origin + location.pathname + '?semapp=1#' + r.codigo;
  const abrir = `intent://c#${r.codigo}#Intent;scheme=lembraai;package=${PACOTE};S.browser_fallback_url=${encodeURIComponent(fallback)};end`;
  const o = r.o;
  let h = '';
  if (o) {
    const [hh, mm] = o.h.split(':').map(Number);
    if (o.de) h += `<div class="de">📩 Compromisso enviado por ${esc(o.de)}</div>`;
    h += `<h1>${esc(o.t)}</h1><p class="quando">${cap(dataCompleta(o.d))}, às ${hora(hh * 60 + mm)}</p>`;
    h += `<section class="caixa"><h2>Como vai avisar</h2><p>${esc(comoAvisar(o))}</p></section>`;
    if (o.o) h += `<p><b>Observação:</b> ${esc(o.o)}</p>`;
    if (o.end) h += `<p><b>Endereço:</b> ${esc(o.end)}</p>`;
  } else {
    h += `<h1>Alguém marcou um compromisso para você</h1>`;
  }
  if (semApp) h += `<div class="aviso">Parece que o Lembra Aí ainda não está instalado neste celular.</div>`;
  if (android) h += `<a class="b verde" href="${abrir}">✓ ABRIR NO LEMBRA AÍ</a><p class="suave">O app abre com tudo preenchido. Lá, é só tocar em "SALVAR NA MINHA AGENDA".</p>`;
  else h += `<div class="aviso">O Lembra Aí é um app para Android. Abra este link no celular Android que tem o app.</div>`;
  h += baixar();
  h += `<section class="caixa"><h2>Plano B: copiar o código</h2><p class="suave">Copie e abra o Lembra Aí. Ele percebe o código sozinho.</p>
    <button class="b contorno" id="copiar">📋 COPIAR CÓDIGO</button><code id="cod">${esc(location.origin + location.pathname + '#' + r.codigo)}</code></section>`;
  app.innerHTML = h;
  document.getElementById('copiar').addEventListener('click', async e => {
    const t = document.getElementById('cod').textContent;
    try { await navigator.clipboard.writeText(t); e.target.textContent = '✓ COPIADO'; }
    catch (er) { const s = getSelection(), rg = document.createRange(); rg.selectNodeContents(document.getElementById('cod')); s.removeAllRanges(); s.addRange(rg); }
  });
}
iniciar();
addEventListener('hashchange', iniciar);
</script>
</body>
</html>
